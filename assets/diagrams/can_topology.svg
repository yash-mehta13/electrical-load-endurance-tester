<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CAN communication topology (planned)</title>
<desc id="d">Planned topology: ESP32 with SN65HVD230 transceiver on a CAN bus connected through a USB-CAN adapter to a PC. No CAN hardware or code exists yet.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="478" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
<text x="24" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24" >CAN communication - planned topology (no CAN code or hardware exists yet)</text>
<rect x="24" y="90" width="200" height="90" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="124.0" y="113.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >ESP32</text>
<text x="124.0" y="131.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >TWAI controller</text>
<text x="124.0" y="149.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >TX / RX GPIO unassigned</text>
<text x="124.0" y="167.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >bit rate undecided</text>
<rect x="284" y="90" width="190" height="90" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="379.0" y="122.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >SN65HVD230</text>
<text x="379.0" y="140.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >3.3 V part</text>
<text x="379.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >standby / slope pins TBD</text>
<rect x="534" y="90" width="190" height="90" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="629.0" y="122.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >CAN bus</text>
<text x="629.0" y="140.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >120 ohm at each end</text>
<text x="629.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >(module may include one)</text>
<rect x="784" y="90" width="192" height="90" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="880.0" y="122.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >USB-CAN adapter</text>
<text x="880.0" y="140.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >in BOM; model not</text>
<text x="880.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >recorded</text>
<path d="M224,135 L284,135" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="254" y="126" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >TX/RX</text>
<path d="M474,135 L534,135" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="504" y="126" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >CANH/L</text>
<path d="M724,135 L784,135" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="784" y="240" width="192" height="70" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="880.0" y="262.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >PC tools</text>
<text x="880.0" y="280.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >SavvyCAN / candump</text>
<text x="880.0" y="298.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >(host side)</text>
<path d="M880,180 L880,240" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="534" y="240" width="190" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="629.0" y="262.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >Optional 2nd node</text>
<text x="629.0" y="280.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >not in BOM, not in roadmap</text>
<text x="629.0" y="298.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >- would need its own plan</text>
<path d="M629,180 L629,240" fill="none" stroke="#1b1f24" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="24" y="232" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24" >Proposed frames (IDs unconfirmed, no implementation):</text>
<text x="32" y="262" font-size="13" font-weight="700" text-anchor="start" fill="#1b1f24" >0x100</text>
<text x="100" y="262" font-size="13" font-weight="400" text-anchor="start" fill="#4a5560" >Status, 10 Hz, ESP32 -&gt; bus</text>
<text x="32" y="286" font-size="13" font-weight="700" text-anchor="start" fill="#1b1f24" >0x101</text>
<text x="100" y="286" font-size="13" font-weight="400" text-anchor="start" fill="#4a5560" >Fault event, on event, ESP32 -&gt; bus</text>
<text x="32" y="310" font-size="13" font-weight="700" text-anchor="start" fill="#1b1f24" >0x200</text>
<text x="100" y="310" font-size="13" font-weight="400" text-anchor="start" fill="#4a5560" >Command, bus -&gt; ESP32</text>
<text x="24" y="360" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Ground reference between the CAN nodes and the 12 V domain is not yet defined; isolation is not claimed.</text>
<rect x="24" y="392" width="28" height="16" rx="3" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="62" y="405" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Planned / not implemented</text>
<rect x="24" y="416" width="28" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="62" y="429" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Unresolved hardware choice</text>
</svg>
