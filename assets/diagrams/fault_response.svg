<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fault detection and response flow</title>
<desc id="d">Flow from measurement acquisition through validity checks, thresholds, debounce, classification, safe state, logging and recovery. Thresholds and classification rules are unresolved.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="728" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
<text x="24" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24" >Fault detection and response - proposed flow (thresholds and classification rules unresolved)</text>
<rect x="40" y="70" width="340" height="64" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="210.0" y="89.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >1  Acquire measurements</text>
<text x="210.0" y="106.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >INA226 (I2C), divider (ADC), DS18B20 (1-Wire),</text>
<text x="210.0" y="123.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >sampled at independent rates (FR3)</text>
<rect x="40" y="170" width="340" height="70" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="210.0" y="192.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >2  Validate samples</text>
<text x="210.0" y="209.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >stale sample, I2C/CRC error, out of range,</text>
<text x="210.0" y="226.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >DS18B20 85.0 C reset value</text>
<rect x="40" y="280" width="340" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="210.0" y="302.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >3  Threshold compare</text>
<text x="210.0" y="319.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >compare against a per-fault threshold;</text>
<text x="210.0" y="336.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >thresholds TBD (no rated limits recorded)</text>
<rect x="40" y="390" width="340" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="210.0" y="412.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >4  Debounce</text>
<text x="210.0" y="429.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >N consecutive samples (firmware/core/debounce.c,</text>
<text x="210.0" y="446.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >host-tested); N per fault TBD</text>
<rect x="40" y="500" width="340" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="210.0" y="522.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >5  Classify</text>
<text x="210.0" y="539.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >transient vs hard: rules NOT defined yet;</text>
<text x="210.0" y="556.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >no fault is treated as safe to retry</text>
<path d="M210,134 L210,170" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<path d="M210,240 L210,280" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<path d="M210,350 L210,390" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<path d="M210,460 L210,500" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="222" y="266" font-size="12" font-weight="400" text-anchor="start" fill="#4a5560" >valid</text>
<text x="222" y="482" font-size="12" font-weight="400" text-anchor="start" fill="#4a5560" >tripped</text>
<text x="392" y="428" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5560" >not tripped: test continues</text>
<rect x="470" y="170" width="260" height="70" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="600.0" y="192.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >SENSOR_INVALID</text>
<text x="600.0" y="209.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >invalid data is itself a fault;</text>
<text x="600.0" y="226.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >never read as &#x27;no fault&#x27;</text>
<path d="M380,205 L470,205" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="196" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >invalid</text>
<rect x="470" y="500" width="260" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="600.0" y="522.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >6  Safe state</text>
<text x="600.0" y="539.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >command load OFF; state FAULT (latched);</text>
<text x="600.0" y="556.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >core host-tested, GPIO polarity TBD</text>
<path d="M380,535 L470,535" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<path d="M600,240 L600,500" fill="none" stroke="#1b1f24" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<rect x="770" y="500" width="206" height="70" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="873.0" y="522.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >7  Log event</text>
<text x="873.0" y="539.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >UART line + CAN 0x101</text>
<text x="873.0" y="556.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >(planned): values, cycle no.</text>
<path d="M730,535 L770,535" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<rect x="770" y="360" width="206" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="873.0" y="384.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b1f24" >8  Recovery policy</text>
<text x="873.0" y="401.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >latched until operator command;</text>
<text x="873.0" y="417.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >auto-retry only with a documented</text>
<text x="873.0" y="434.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >rationale (none yet)</text>
<path d="M873,500 L873,450" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="610" width="936" height="50" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="508.0" y="639.5" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f24" >Detecting a fault in software is not physical protection: fuse/PTC, current-limited PSU and any hardware trip must act independently.</text>
<rect x="40" y="676" width="28" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="78" y="689" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Logic exists and is host-unit-tested; not integrated</text>
<rect x="40" y="700" width="28" height="16" rx="3" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="78" y="713" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Planned / not implemented</text>
<rect x="500" y="676" width="28" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="538" y="689" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Unresolved hardware choice</text>
</svg>
