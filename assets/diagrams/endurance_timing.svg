<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Endurance test timing (illustrative)</title>
<desc id="d">Illustrative timing diagram: ON and OFF intervals for three cycles, with the cycle counter incrementing at the end of each OFF interval, then COMPLETE. Not measured data.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="428" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
<text x="24" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24" >Endurance cycle timing - ILLUSTRATIVE example (on_ms, off_ms, target_cycles = 3), not measured data</text>
<text x="24" y="128" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24" >load command</text>
<text x="24" y="146" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5560" >(true only in RUNNING_ON)</text>
<path d="M230,160 L230,100 L320,100 L320,160 L450,160 L450,100 L540,100 L540,160 L670,160 L670,100 L760,100 L760,160 L890,160" fill="none" stroke="#1d4ed8" stroke-width="3"/>
<rect x="230" y="100" width="90" height="60" fill="#dbeafe" opacity="0.55"/>
<text x="275.0" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4ed8" >ON</text>
<text x="385.0" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#4a5560" >OFF</text>
<line x1="450" y1="88" x2="450" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<line x1="230" y1="88" x2="230" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="450" y="100" width="90" height="60" fill="#dbeafe" opacity="0.55"/>
<text x="495.0" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4ed8" >ON</text>
<text x="605.0" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#4a5560" >OFF</text>
<line x1="670" y1="88" x2="670" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<line x1="450" y1="88" x2="450" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<rect x="670" y="100" width="90" height="60" fill="#dbeafe" opacity="0.55"/>
<text x="715.0" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4ed8" >ON</text>
<text x="825.0" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#4a5560" >OFF</text>
<line x1="890" y1="88" x2="890" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<line x1="670" y1="88" x2="670" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<line x1="890" y1="88" x2="890" y2="300" stroke="#8c959f" stroke-dasharray="4 4"/>
<path d="M230,208 L320,208" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="275.0" y="224" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >on_ms</text>
<path d="M320,208 L450,208" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="385.0" y="224" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >off_ms</text>
<text x="24" y="268" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24" >cycles completed</text>
<text x="24" y="286" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5560" >(counter)</text>
<line x1="230" y1="272" x2="450" y2="272" stroke="#15803d" stroke-width="3"/>
<circle cx="450" cy="272" r="5" fill="#15803d"/>
<text x="458" y="262" font-size="14" font-weight="700" text-anchor="start" fill="#15803d" >1</text>
<line x1="450" y1="272" x2="670" y2="272" stroke="#15803d" stroke-width="3"/>
<circle cx="670" cy="272" r="5" fill="#15803d"/>
<text x="678" y="262" font-size="14" font-weight="700" text-anchor="start" fill="#15803d" >2</text>
<line x1="670" y1="272" x2="890" y2="272" stroke="#15803d" stroke-width="3"/>
<circle cx="890" cy="272" r="5" fill="#15803d"/>
<text x="898" y="262" font-size="14" font-weight="700" text-anchor="start" fill="#15803d" >3</text>
<line x1="230" y1="272" x2="230" y2="272"/>
<text x="238" y="262" font-size="14" font-weight="700" text-anchor="start" fill="#15803d" >0</text>
<text x="840" y="322" font-size="12.5" font-weight="700" text-anchor="middle" fill="#15803d" >COMPLETE: load stays OFF</text>
<text x="24" y="360" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f24" >A cycle counts only when its ON interval and the following OFF interval have both fully elapsed.</text>
<text x="24" y="380" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f24" >A stop or a fault during either interval drives the load OFF immediately and the partial cycle is not counted.</text>
<text x="24" y="406" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Interval values are placeholders; real limits depend on the load and switch ratings (not yet recorded).</text>
</svg>
