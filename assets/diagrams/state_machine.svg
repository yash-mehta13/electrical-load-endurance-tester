<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Endurance state machine</title>
<desc id="d">State diagram of the endurance scheduler core: BOOT, IDLE, RUNNING_ON, RUNNING_OFF, COMPLETE and FAULT with transitions.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="698" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
<text x="24" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24" >Endurance state machine - implemented in firmware/core, host-unit-tested only</text>
<rect x="40" y="90" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="115.0" y="114.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >BOOT</text>
<text x="115.0" y="132.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >load OFF</text>
<rect x="300" y="90" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="375.0" y="114.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >IDLE</text>
<text x="375.0" y="132.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >load OFF</text>
<rect x="530" y="68" width="250" height="262" rx="12" fill="none" stroke="#4a5560" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="542" y="86" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5560" >RUNNING (either phase)</text>
<rect x="560" y="100" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="635.0" y="124.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >RUNNING_ON</text>
<text x="635.0" y="142.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >load ON</text>
<rect x="560" y="250" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="635.0" y="274.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >RUNNING_OFF</text>
<text x="635.0" y="292.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >load OFF</text>
<rect x="560" y="410" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="635.0" y="434.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >COMPLETE</text>
<text x="635.0" y="452.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >load OFF</text>
<rect x="40" y="540" width="440" height="70" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="260.0" y="562.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f24" >FAULT</text>
<text x="260.0" y="579.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >load OFF, latched; fault code and cycles-at-fault recorded;</text>
<text x="260.0" y="596.5" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >no automatic restart</text>
<path d="M190,118 L300,118" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="245" y="108" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >self-test passed</text>
<path d="M450,128 L560,128" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="505" y="118" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5560" >start</text>
<text x="505" y="146" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >(valid profile)</text>
<path d="M635,156 L635,250" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="645" y="208" font-size="12" font-weight="400" text-anchor="start" fill="#4a5560" >on_ms elapsed</text>
<path d="M710,278 L750,278 L750,128 L710,128" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="792" y="190" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >off_ms elapsed,</text>
<text x="792" y="206" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >cycles &lt; target</text>
<text x="792" y="222" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >(cycle counted)</text>
<path d="M635,306 L635,410" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="645" y="350" font-size="11" font-weight="400" text-anchor="start" fill="#4a5560" >off_ms elapsed,</text>
<text x="645" y="366" font-size="11" font-weight="400" text-anchor="start" fill="#4a5560" >cycles == target</text>
<text x="645" y="382" font-size="11" font-weight="400" text-anchor="start" fill="#4a5560" >(last cycle counted)</text>
<path d="M530,200 L420,200 L420,146" fill="none" stroke="#1b1f24" stroke-width="2" marker-end="url(#ah)"/>
<text x="475" y="190" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >stop</text>
<text x="420" y="228" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >partial cycle not</text>
<text x="420" y="243" font-size="11" font-weight="400" text-anchor="middle" fill="#4a5560" >counted; load OFF</text>
<text x="635" y="490" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >new start -&gt; RUNNING_ON</text>
<text x="635" y="506" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >(counters reset)</text>
<path d="M115,540 L115,146" fill="none" stroke="#be123c" stroke-width="2" marker-end="url(#ah)"/>
<text x="125" y="330" font-size="12" font-weight="700" text-anchor="start" fill="#be123c" >any state: fault raised</text>
<text x="125" y="348" font-size="11.5" font-weight="400" text-anchor="start" fill="#be123c" >(first fault code is kept;</text>
<text x="125" y="364" font-size="11.5" font-weight="400" text-anchor="start" fill="#be123c" >load OFF at once)</text>
<path d="M360,540 L360,146" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="350" y="420" font-size="11.5" font-weight="700" text-anchor="end" fill="#b45309" >operator-authorized</text>
<text x="350" y="437" font-size="11.5" font-weight="400" text-anchor="end" fill="#b45309" >clear -&gt; IDLE (does not</text>
<text x="350" y="453" font-size="11.5" font-weight="400" text-anchor="end" fill="#b45309" >resume the test)</text>
<rect x="520" y="540" width="456" height="76" rx="8" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="748.0" y="565.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1b1f24" >Not in the core yet: SELF_TEST, READY, STOPPING (needs load-OFF</text>
<text x="748.0" y="582.25" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1b1f24" >feedback), RECOVERING. Retry policy intentionally undefined -</text>
<text x="748.0" y="598.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1b1f24" >see docs/fault_policy.md</text>
<rect x="24" y="632" width="28" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="62" y="645" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Logic exists and is host-unit-tested; not integrated</text>
<rect x="24" y="656" width="28" height="16" rx="3" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
<text x="62" y="669" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Fault / latched state</text>
<rect x="520" y="632" width="28" height="16" rx="3" fill="#f1f3f5" stroke="#5c6773" stroke-width="2" stroke-dasharray="7 4"/>
<text x="558" y="645" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a5560" >Planned / not implemented</text>
</svg>
