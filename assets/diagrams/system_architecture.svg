<text x="24" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24" >System architecture - intended design (Phase 0: nothing here is hardware-verified)</text>
<rect x="24" y="70" width="130" height="70" rx="8" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
