<text x="925.0" y="101.0" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f24" >flyback diode</text>
<text x="925.0" y="118.0" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f24" >(inductive)</text>
