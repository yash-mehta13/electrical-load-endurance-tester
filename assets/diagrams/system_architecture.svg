<text x="850.0" y="441.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >defined yet beyond fuse/PTC and, for</text>
<text x="850.0" y="457.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >option A, the BTS7960&#x27;s own protection</text>
<text x="850.0" y="474.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >(unverified). A firmware load-OFF</text>
<text x="850.0" y="490.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4a5560" >is not physical protection.</text>
