<text x="559.0" y="262.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >on switch / heatsink</text>
<text x="559.0" y="280.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >(pull-up not in BOM)</text>
