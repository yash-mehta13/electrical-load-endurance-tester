<text x="754.0" y="110.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >relay / solenoid /</text>
<text x="754.0" y="128.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >motor / lamp</text>
