<text x="279.0" y="119.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f24" >rating TBD</text>
<rect x="404" y="56" width="220" height="98" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="514.0" y="83.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f24" >Switching stage (high-side)</text>
<text x="514.0" y="101.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >A: BTS7960 module</text>
<text x="514.0" y="119.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >B: N-MOSFET + gate driver</text>
<text x="514.0" y="137.0" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5560" >(not decided)</text>
