<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">System architecture (intended)</title>
<desc id="d">Block diagram of the intended single-channel 12 V DC endurance tester: bench supply, protection, switching stage options, load, sensing, ESP32, UART and CAN. Nothing is hardware-verified.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/></marker></defs>
